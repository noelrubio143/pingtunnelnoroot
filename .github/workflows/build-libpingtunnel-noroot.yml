name: Build libpingtunnel (no-root / Android ICMP datagram)

# Builds libpingtunnel.so for Android with GOOS=android, which makes the Go
# build-tag selector in esrrhs/pingtunnel pick icmp_listen_android.go
# (unprivileged icmp.ListenPacket("udp4", ...)) instead of icmp_listen_other.go
# (raw ICMP socket, needs root/CAP_NET_RAW). No source patch needed -- GOOS
# alone decides which file compiles in.
#
# android/arm64 links fine with the pure-Go internal linker (CGO_ENABLED=0).
# android/arm (32-bit, armeabi-v7a) requires EXTERNAL linking, so that one
# needs cgo + a real C cross-compiler -> we pull the Android NDK and point
# CC at its clang for that architecture only.
#
# Run from the Actions tab (workflow_dispatch), then download the
# "libpingtunnel-noroot" artifact and drop the two .so files into:
#   app/src/main/jniLibs/arm64-v8a/libpingtunnel.so
#   app/src/main/jniLibs/armeabi-v7a/libpingtunnel.so
# (overwriting the old ones), then rebuild the APK as usual.

on:
  workflow_dispatch:
    inputs:
      pingtunnel_ref:
        description: "esrrhs/pingtunnel git ref to build (branch, tag, or commit)"
        required: false
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            goarm: ""
            cgo: "0"
            clang_target: ""
          - abi: armeabi-v7a
            goarch: arm
            goarm: "7"
            cgo: "1"
            clang_target: armv7a-linux-androideabi21-clang
    steps:
      - name: Checkout upstream pingtunnel
        uses: actions/checkout@v4
        with:
          repository: esrrhs/pingtunnel
          ref: ${{ github.event.inputs.pingtunnel_ref }}
          path: pingtunnel

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Android NDK
        if: matrix.cgo == '1'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          local-cache: true

      - name: "Sanity check: android build file is present"
        working-directory: pingtunnel
        run: |
          test -f icmp_listen_android.go
          echo "Found icmp_listen_android.go -- GOOS=android will select this file automatically."

      - name: Download Go module deps
        working-directory: pingtunnel
        run: go mod download

      - name: Build libpingtunnel.so (CGO disabled, arm64 only)
        if: matrix.cgo == '0'
        working-directory: pingtunnel
        env:
          CGO_ENABLED: 0
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../out/${{ matrix.abi }}
          go build -v -trimpath -ldflags="-s -w" \
            -o ../out/${{ matrix.abi }}/libpingtunnel.so \
            ./cmd

      - name: Build libpingtunnel.so (CGO + NDK clang, armeabi-v7a only)
        if: matrix.cgo == '1'
        working-directory: pingtunnel
        env:
          CGO_ENABLED: 1
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang_target }}
        run: |
          mkdir -p ../out/${{ matrix.abi }}
          go build -v -trimpath -ldflags="-s -w" \
            -o ../out/${{ matrix.abi }}/libpingtunnel.so \
            ./cmd

      - name: "Confirm binary type: expect Android, not Linux"
        run: file out/${{ matrix.abi }}/libpingtunnel.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpingtunnel-noroot-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/libpingtunnel.so
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Lay out as jniLibs per ABI
        run: |
          mkdir -p bundle/arm64-v8a bundle/armeabi-v7a
          cp downloaded/libpingtunnel-noroot-arm64-v8a/libpingtunnel.so bundle/arm64-v8a/libpingtunnel.so
          cp downloaded/libpingtunnel-noroot-armeabi-v7a/libpingtunnel.so bundle/armeabi-v7a/libpingtunnel.so
      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: libpingtunnel-noroot
          path: bundle/**
